name: Weekly Sync

on:
  schedule:
    - cron: '0 6 * * 1'   # 03h BRT (UTC-3) de segunda-feira = 06:00 UTC
  workflow_dispatch:        # permite rodar manualmente pelo GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Run CMC/CMV scrape
        run: python cmc_cmv_mapear.py

      - name: Run Cantucci OS weekly indicators
        env:
          CANTUCCI_OS_USER: julhyana
          CANTUCCI_OS_PASS: ${{ secrets.CANTUCCI_OS_PASS }}
        run: python cantucci_os_semanal.py

      - name: Run weekly sync
        env:
          FALAE_EMAIL: operacoes@cantucci.com.br
          FALAE_SENHA: ${{ secrets.FALAE_SENHA }}
        run: python weekly_sync.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add WEEKLY_CACHE.json CMC_CMV_DADOS.json CANTUCCI_OS_SEMANAL.json
          git diff --staged --quiet || git commit -m "Weekly report $(date '+%Y-%m-%d')"
          git push
